name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Install packaging tools
        run: brew install librsvg create-dmg

      - name: Determine version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*static let version = "\([^"]*\)"[[:space:]]*$/\1/p' macos/Sources/toolboxDesktop/ToolboxConfig.swift)"

          if [[ -z "$version" ]]; then
            echo "ToolboxConfig.version is missing or invalid" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"

            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag version $tag_version does not match ToolboxConfig.version $version" >&2
              exit 1
            fi
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build self-contained app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./macos/scripts/build-app.sh

      - name: Verify arm64 build
        shell: bash
        run: |
          APP="macos/dist/toolbox desktop.app"

          echo "Main executable:"
          file "$APP/Contents/MacOS/toolboxDesktop"

          echo "CLI launcher:"
          file "$APP/Contents/MacOS/toolbox"

          # toolboxDesktop is the compiled Swift executable and must be arm64.
          if ! file "$APP/Contents/MacOS/toolboxDesktop" | grep -q "Mach-O 64-bit executable arm64"; then
            echo "toolboxDesktop is not an arm64 Mach-O executable" >&2
            exit 1
          fi

          # toolbox is intentionally a POSIX shell launcher, not a Mach-O binary.
          if [ ! -x "$APP/Contents/MacOS/toolbox" ]; then
            echo "toolbox CLI launcher is not executable" >&2
            exit 1
          fi

          echo "arm64 application verification passed."

      - name: Build ZIP
        shell: bash
        run: |
          cd macos/dist

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "toolbox desktop.app" \
            "toolbox-desktop-${{ steps.version.outputs.value }}-macos.zip"

      - name: Build styled DMG
        shell: bash
        run: |
          ./macos/scripts/build-dmg.sh \
            "macos/dist/toolbox desktop.app" \
            "macos/dist/toolbox-desktop-${{ steps.version.outputs.value }}-macos.dmg"

      - name: Show DMG checksum
        shell: bash
        run: |
          shasum -a 256 \
            "macos/dist/toolbox-desktop-${{ steps.version.outputs.value }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-macos-arm64
          path: |
            macos/dist/toolbox-desktop-*-macos.dmg
            macos/dist/toolbox-desktop-*-macos.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolbox-macos-arm64
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes

          gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.dmg \
            release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  update-homebrew:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolbox-macos-arm64
          path: release-assets

      - name: Determine release information
        id: release
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          version="${TAG#v}"
          dmg="release-assets/toolbox-desktop-${version}-macos.dmg"

          if [[ ! -f "$dmg" ]]; then
            echo "DMG not found: $dmg" >&2
            exit 1
          fi

          sha256="$(sha256sum "$dmg" | cut -d ' ' -f 1)"

          echo "Version: $version"
          echo "SHA256: $sha256"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: PiSaucer/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update toolbox-desktop cask
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          ruby -e '
            path = "Casks/toolbox-desktop.rb"
            cask = File.read(path)

            version_changed = cask.sub!(
              /^\s*version ".*"$/,
              %(  version "#{ENV.fetch("VERSION")}")
            )

            sha_changed = cask.sub!(
              /^\s*sha256 ".*"$/,
              %(  sha256 "#{ENV.fetch("SHA256")}")
            )

            abort "Cask is missing its version declaration" unless version_changed
            abort "Cask is missing its sha256 declaration" unless sha_changed

            File.write(path, cask)
          '

          echo "Updated cask:"
          cat Casks/toolbox-desktop.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Casks/toolbox-desktop.rb
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git commit -m "toolbox-desktop ${VERSION}"
          git push
